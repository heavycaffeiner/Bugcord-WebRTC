name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          ./gradlew :assembleRelease

      - name: Collect artifact
        run: |
          aar="$(find build/outputs/aar -name '*.aar' | head -n1)"
          test -n "$aar"
          cp "$aar" Bugcordwebrtc.aar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugcordwebrtc
          if-no-files-found: error
          path: Bugcordwebrtc.aar

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(grep -oP 'version = "\K[^"]+' build.gradle.kts | head -n1)"
          test -n "$version"
          gh release delete "$version" --cleanup-tag --yes || true
          gh release create "$version" Bugcordwebrtc.aar \
            --title "Bugcordwebrtc $version" \
            --notes "Built from $GITHUB_SHA"
